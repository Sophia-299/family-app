<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>修改访问口令</title>
<style>html,body{height:100%}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#1f2a44,#3a2b5f);color:#fff;display:flex;align-items:center;justify-content:center}.box{background:rgba(255,255,255,.08);padding:34px 38px;border-radius:18px;width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);backdrop-filter:blur(8px)}h1{font-size:20px;margin:0 0 6px}.sub{opacity:.7;font-size:13px;margin:0 0 18px}label{display:block;text-align:left;font-size:13px;opacity:.85;margin:10px 0 6px}input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:15px;box-sizing:border-box;outline:none}input:focus{border-color:#ffce6b}button{width:100%;padding:12px;border:0;border-radius:10px;background:#ffce6b;color:#3a2b5f;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}#msg{font-size:13px;min-height:18px;margin-top:12px}a{color:#ffce6b;font-size:12px;text-decoration:none}</style>
</head>
<body>
<div class="box">
<h1>🔧 修改访问口令</h1>
<p class="sub">仅家长可操作（需先输入当前口令）</p>
<label>当前口令</label><input id="old" type="password" placeholder="当前口令" autofocus>
<label>新口令</label><input id="np" type="password" placeholder="新口令（建议 8 位以上）">
<label>再次输入新口令</label><input id="np2" type="password" placeholder="再次输入新口令">
<button id="go">确认修改</button>
<div id="msg"></div>
<div style="margin-top:14px"><a href="https://sophia-299.github.io/family-app/">← 返回登录</a></div>
</div>
<script>
const API = 'https://djmmrlnqdlvhjmxdxgtn.functions.supabase.co/family-app/api';
const token = localStorage.getItem('fa_token') || '';
async function change() {
  const oldP = document.getElementById('old').value;
  const np = document.getElementById('np').value;
  const np2 = document.getElementById('np2').value;
  const msg = document.getElementById('msg');
  if (!oldP) { msg.style.color='#ff9b9b'; msg.textContent='请输入当前口令'; return; }
  if (!np || np.length < 4) { msg.style.color='#ff9b9b'; msg.textContent='新口令至少 4 位'; return; }
  if (np !== np2) { msg.style.color='#ff9b9b'; msg.textContent='两次输入不一致'; return; }
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['x-fa-token'] = token;
  try {
    const v = await fetch(API + '/settings/verify-password', { method:'POST', headers, body: JSON.stringify({ password: oldP }) });
    const vj = await v.json();
    if (!(vj && vj.ok && vj.data && vj.data.valid)) { msg.style.color='#ff9b9b'; msg.textContent='当前口令不正确'; return; }
    const r = await fetch(API + '/settings/parent-password?role=parent', { method:'POST', headers, body: JSON.stringify({ password: np }) });
    const j = await r.json();
    if (j && j.ok) {
      msg.style.color='#9bffb0'; msg.textContent='口令已修改，正在返回登录…';
      localStorage.removeItem('fa_token');
      setTimeout(() => location.href = 'https://sophia-299.github.io/family-app/', 1500);
    } else {
      msg.style.color='#ff9b9b'; msg.textContent = (j && j.error) || '修改失败';
    }
  } catch (e) {
    msg.style.color='#ff9b9b'; msg.textContent='网络错误，请重试';
  }
}
document.getElementById('go').onclick = change;
document.getElementById('old').addEventListener('keydown', e => { if (e.key === 'Enter') change(); });
document.getElementById('np').addEventListener('keydown', e => { if (e.key === 'Enter') change(); });
document.getElementById('np2').addEventListener('keydown', e => { if (e.key === 'Enter') change(); });
</script>
</body>
</html>
